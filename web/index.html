<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Folder-Mind</title>
    <link rel="icon" href="/favicon.svg" />
    <meta
      name="htmx-config"
      content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'
    />
    <link rel="stylesheet" href="/style.css" />
    <script src="/htmx.min.js" defer></script>
    <script src="/chat.js" defer></script>
    <script src="/inbox.js" defer></script>
    <script src="/agents.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <button id="nav-toggle" class="secondary" aria-label="Menü öffnen" aria-expanded="false">☰</button>
      <a href="/">◈ Folder-Mind</a
      ><div class="row"><small id="app-version"></small><button id="theme" title="Darstellung wechseln">Hell / Dunkel</button></div>
    </header>
    <div class="layout">
      <nav id="nav"></nav>
      <main>
        <div id="notice" role="status"></div>
        <div id="content"></div>
        <footer>
          <small
            ><a href="/third-party.txt">Drittanbieterlizenzen</a> · Folder-Mind
            · MIT</small
          >
        </footer>
      </main>
    </div>
    <dialog id="confirm">
      <p id="confirm-text"></p>
      <button id="confirm-yes">Bestätigen</button
      ><button id="confirm-no">Abbrechen</button>
    </dialog>
  </body>
</html>
