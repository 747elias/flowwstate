name: Release-Dateien hochladen
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Vorbereiteter Release-Tag
        required: true
        type: string
      run_id:
        description: Erfolgreicher Windows-Prüflauf mit EXE-Artefakt
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Herkunft und Release-Entwurf prüfen
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          jq -e '.conclusion == "success" and .path == ".github/workflows/windows.yml" and .event == "push"' run.json
          build_sha=$(jq -r '.head_sha' run.json)
          gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release.json
          jq -e --arg sha "$build_sha" '.isDraft == true and .targetCommitish == $sha' release.json
      - uses: actions/download-artifact@v4
        with:
          name: folder-mind-windows-x86_64
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Prüfsumme erstellen
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          test -s folder-mind.exe
          sha256sum folder-mind.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Geprüfte EXE an den Entwurf anhängen
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/folder-mind.exe dist/SHA256SUMS.txt
