name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['flowstate-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Flowstate.Tests -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish native WinUI application
        run: dotnet publish src/Flowstate.App/Flowstate.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o artifacts/app
      - name: Verify WinUI resource payload
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/app/resources.pri)) { throw 'Missing application resource index' }
          Get-ChildItem artifacts/app/*.pri | Select-Object Name,Length
      - name: Create installer
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer/Flowstate.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = Get-ChildItem artifacts/installer/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content artifacts/installer/SHA256SUMS.txt -Encoding ascii
      - name: Installer smoke test
        shell: pwsh
        run: |
          $setup = (Get-ChildItem artifacts/installer/*.exe | Select-Object -First 1).FullName
          $target = "$env:LOCALAPPDATA\Programs\Flowstate-CI"
          $p = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$target") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          if (!(Test-Path "$target\Flowstate.App.exe")) { throw 'Installed executable missing' }
          $app = Start-Process "$target\Flowstate.App.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "App exited during launch: $($app.ExitCode)" }
          if (!(Test-Path "$env:LOCALAPPDATA\Flowstate\flowstate.db")) { throw 'Database was not created' }
          & ./scripts/ui-smoke.ps1 -AppProcessId $app.Id
          Stop-Process -Id $app.Id
          $un = Start-Process "$target\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($un.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (!(Test-Path "$env:LOCALAPPDATA\Flowstate\flowstate.db")) { throw 'Uninstall removed user data' }
      - uses: actions/upload-artifact@v4
        with:
          name: Flowstate-Windows-x64
          path: artifacts/installer/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: artifacts/screenshots
      - name: Print startup diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA/Flowstate/Logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'Flowstate' } | Select-Object -First 5 | Format-List TimeCreated,Id,Message
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-diagnostics
          path: ~/AppData/Local/Flowstate/Logs
  release:
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    needs: windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Flowstate-Windows-x64
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('Directory.Build.props').findtext('.//Version'))")
          gh release create "flowstate-v$version" release/* --target "$GITHUB_SHA" --prerelease --title "Flowstate $version" --notes-file docs/release-notes.md
