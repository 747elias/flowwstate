[workspace]
members = ["crates/*"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
[workspace.dependencies]
tokio = { version = "=1.48.0", features = ["full"] }
axum = { version = "=0.8.6", features = ["multipart", "macros"] }
tower = { version = "=0.5.2", features = ["util"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "backup"] }
tantivy = "=0.25.0"
notify = "=8.2.0"
keyring = { version = "=3.6.3", features = ["windows-native"] }
rcgen = "=0.14.5"
rustls = { version = "=0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
axum-server = { version = "=0.7.2", features = ["tls-rustls-no-provider"] }
argon2 = "=0.5.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.9.8"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
sha2 = "=0.10.9"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
thiserror = "=2.0.17"
dunce = "=1.0.5"
rust-embed = "=8.9.0"
pdf-extract = "=0.9.0"
scraper = "=0.24.0"
futures-util = "=0.3.31"
async-stream = "=0.3.6"
ipnet = { version = "=2.11.0", features = ["serde"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
quick-xml = "=0.38.3"
calamine = "=0.31.0"
url = "=2.5.7"
tempfile = "=3.23.0"
windows = { version = "=0.61.3", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation", "Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams", "Foundation", "Globalization", "Data_Pdf"] }
tray-icon = "=0.21.2"
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
