name: Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Formatierung
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: Release bauen
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: folder-mind-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/folder-mind.exe
          if-no-files-found: error
